name: Install locked dependencies
description: Retry npm ci after transient registry, prebuild or Node header download failures
runs:
  using: composite
  steps:
    - name: Install dependencies with bounded retries
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if npm ci; then
            exit 0
          else
            status=$?
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::npm ci failed after 3 attempts (exit $status)."
            exit "$status"
          fi
          delay=$((attempt * 5))
          echo "::warning::npm ci attempt $attempt failed (exit $status); retrying in ${delay}s."
          sleep "$delay"
        done
